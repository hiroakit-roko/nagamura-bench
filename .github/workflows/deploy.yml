name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 複数のAIが並行して push するため、最新の push だけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all model sites
        run: |
          set -uo pipefail
          rm -rf _site && mkdir -p _site/_shots
          cp index.html models.json _site/
          echo '{}' > _site/status.json

          for slug in $(jq -r '.[].slug' models.json); do
            echo "::group::Build $slug"
            status=ok
            if [ ! -d "$slug" ]; then
              status=missing
            elif [ -f "$slug/package.json" ]; then
              (
                cd "$slug" &&
                if [ -f package-lock.json ]; then npm ci; else npm install; fi &&
                npm run build
              ) && [ -d "$slug/dist" ] && cp -R "$slug/dist" "_site/$slug" || status=failed
            else
              rsync -a --exclude node_modules --exclude AGENTS.md --exclude CLAUDE.md "$slug/" "_site/$slug/"
            fi

            if [ "$status" != ok ]; then
              rm -rf "_site/$slug" && mkdir -p "_site/$slug"
              printf '<!doctype html><meta charset="utf-8"><title>%s — build %s</title><body style="font-family:sans-serif;padding:40px"><h1>%s</h1><p>ビルドに失敗しました（%s）。GitHub Actions のログを確認してください。</p><a href="../">← 一覧へ</a>' \
                "$slug" "$status" "$slug" "$status" > "_site/$slug/index.html"
            fi
            jq --arg s "$slug" --arg v "$status" '.[$s]=$v' _site/status.json > _site/status.tmp && mv _site/status.tmp _site/status.json
            echo "::endgroup::"
            echo "$slug: $status"
          done
          cat _site/status.json

      - name: Capture thumbnails
        continue-on-error: true
        run: |
          npm install --no-save --prefix /tmp/shots playwright@1 >/dev/null
          /tmp/shots/node_modules/.bin/playwright install --with-deps chromium >/dev/null
          (cd _site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          cat > /tmp/shots/shoot.mjs <<'EOF'
          import { chromium } from '/tmp/shots/node_modules/playwright/index.mjs';
          import fs from 'node:fs';
          const models = JSON.parse(fs.readFileSync('_site/models.json', 'utf8'));
          const browser = await chromium.launch({ args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
          for (const m of models) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            try {
              await page.goto(`http://localhost:8080/${m.slug}/`, { waitUntil: 'networkidle', timeout: 30000 });
              await page.waitForTimeout(4000);
              await page.screenshot({ path: `_site/_shots/${m.slug}.jpg`, type: 'jpeg', quality: 80 });
              console.log('shot', m.slug);
            } catch (e) { console.log('skip', m.slug, e.message); }
            await page.close();
          }
          await browser.close();
          EOF
          node /tmp/shots/shoot.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
